
name: Build VR Space APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract VR Space
        run: unzip -q VRSpace-Android-mobile-build.zip -d source

      - name: Fix Android Gradle Plugin
        working-directory: source/VRSpace-Android
        run: |
          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'libs.versions.toml' \) -not -path '*/.gradle/*' -not -path '*/build/*' -exec sed -i 's/8\.7\.3/8.9.1/g' {} +

          if grep -RInE --include='*.gradle' --include='*.gradle.kts' --include='libs.versions.toml' '8\.7\.3' .; then
            echo "ERRO: ainda existe AGP 8.7.3"
            exit 1
          fi

          if ! grep -RInE --include='*.gradle' --include='*.gradle.kts' --include='libs.versions.toml' '8\.9\.1' .; then
            echo "ERRO: não foi encontrada a versão 8.9.1"
            exit 1
          fi

      - name: Build APK
        working-directory: source/VRSpace-Android
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Space-APK
          path: source/VRSpace-Android/app/build/outputs/apk/debug/app-debug.apk
