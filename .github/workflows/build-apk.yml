
name: Build VR Space APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract VR Space
        run: unzip -q VRSpace-Android-mobile-build.zip -d source

      - name: Fix Android Gradle Plugin and SDK
        working-directory: source/VRSpace-Android
        shell: bash
        run: |
          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'libs.versions.toml' \) -not -path '*/.gradle/*' -not -path '*/build/*' -exec perl -pi -e '
            s/\b8\.7\.3\b/8.10.0/g;
            s/\bcompileSdkVersion\s*=?\s*35\b/compileSdkVersion 36/g;
            s/\bcompileSdk\s*=\s*35\b/compileSdk = 36/g;
            s/\bcompileSdk\s+35\b/compileSdk 36/g;
          ' {} +

          echo "Checking Android Gradle Plugin..."
          grep -RInE --include='*.gradle' --include='*.gradle.kts' --include='libs.versions.toml' '8\.10\.0' .

          echo "Checking compileSdk..."
          grep -RInE --include='*.gradle' --include='*.gradle.kts' 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*36' .

      - name: Build APK
        working-directory: source/VRSpace-Android
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Space-APK
          path: source/VRSpace-Android/app/build/outputs/apk/debug/app-debug.apk
